# DevSecOps pipeline (Gitea Actions). Stages run in order and each one gates
# the next:
#   secrets -> sast -> sca -> build-test -> container-scan -> dast -> release
# `release` bumps the image tag in deploy/k8s/kustomization.yaml; ArgoCD
# deploys it once develop is merged into master (see README "CI/CD").
#
# Tools need no accounts. Third-party binaries are pinned by version and
# SHA-256, actions by commit SHA, images by digest.
name: Main Pipeline

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "deploy/**" # the release job's own tag bump must not re-trigger the pipeline
  pull_request:
    branches:
      - develop
  workflow_dispatch: # manual reruns from the Actions tab

env:
  REGISTRY: gitea.lucasggmoreira.com.br
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  GOSEC_VERSION: v2.29.0
  SYFT_VERSION: "1.52.0"
  SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
  GRYPE_VERSION: "0.119.0"
  GRYPE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b

jobs:
  secrets:
    name: Exposed credential check (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # scan the whole commit history

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks

      - name: Scan history for secrets
        run: gitleaks git --redact --verbose .

  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"

      - name: Static analysis
        # Fails on medium+ severity findings reported with medium+ confidence.
        run: "$(go env GOPATH)/bin/gosec -severity medium -confidence medium ./..."

  sca:
    name: SCA + SBOM (syft, grype)
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install syft and grype
        run: |
          curl -sSfL -o /tmp/syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /usr/local/bin syft
          curl -sSfL -o /tmp/grype.tgz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  /tmp/grype.tgz" | sha256sum -c -
          tar -xzf /tmp/grype.tgz -C /usr/local/bin grype

      - name: Generate SBOM (CycloneDX)
        run: syft scan dir:. -o cyclonedx-json=sbom.cdx.json

      - name: Scan dependencies
        run: grype sbom:sbom.cdx.json --fail-on high

      - uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20 (Gitea does not support v4)
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json

  build-test:
    name: Build + Tests
    runs-on: ubuntu-latest
    needs: sca
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Same checks as `make test`. Postgres and the Go toolchain run on a
      # Docker network created here, and the code is copied in with `docker cp`,
      # so this works whether the runner's Docker is local or DinD (no service
      # containers or bind mounts).
      - name: gofmt, go vet, go test (with Postgres)
        run: |
          NET="ci-${{ github.run_id }}-test"
          trap 'docker rm -f "$NET-pg" "$NET-go" >/dev/null 2>&1; docker network rm "$NET" >/dev/null 2>&1' EXIT
          docker network create "$NET"
          docker run -d --name "$NET-pg" --network "$NET" \
            -e POSTGRES_USER=ford -e POSTGRES_PASSWORD=ford -e POSTGRES_DB=ford_retain \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          for i in $(seq 30); do
            docker exec "$NET-pg" pg_isready -h localhost -U ford -d ford_retain && break
            [ "$i" = 30 ] && { docker logs "$NET-pg"; exit 1; }
            sleep 2
          done
          docker create --name "$NET-go" --network "$NET" -w /app \
            -e TEST_DATABASE_URL="postgres://ford:ford@$NET-pg:5432/ford_retain?sslmode=disable" \
            golang:1.27-alpine@sha256:8a5910f31396cd4d89662f56c68b3ae31d374308270a1c3bd96672ee5ed43414 \
            sh -c 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }; go vet ./... && go test ./...'
          docker cp . "$NET-go:/app"
          docker start -a "$NET-go"

      - name: Build and push image
        id: image
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          IMAGE="${REGISTRY}/${{ github.repository }}:${{ github.sha }}"
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "${{ github.repository_owner }}" --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          docker logout "$REGISTRY"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  container-scan:
    name: Container Scan (grype)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Install grype
        run: |
          curl -sSfL -o /tmp/grype.tgz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  /tmp/grype.tgz" | sha256sum -c -
          tar -xzf /tmp/grype.tgz -C /usr/local/bin grype

      - name: Scan image
        env:
          GRYPE_REGISTRY_AUTH_AUTHORITY: ${{ env.REGISTRY }}
          GRYPE_REGISTRY_AUTH_USERNAME: ${{ github.repository_owner }}
          GRYPE_REGISTRY_AUTH_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}
        run: grype "registry:${{ needs.build-test.outputs.image }}" --fail-on high

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: [build-test, container-scan]
    steps:
      # The image under test (in-memory demo data) and ZAP share a Docker
      # network created here, for the same reason as in build-test.
      - name: Baseline scan
        env:
          IMAGE: ${{ needs.build-test.outputs.image }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          NET="ci-${{ github.run_id }}-dast"
          trap 'docker rm -f "$NET-api" >/dev/null 2>&1; docker network rm "$NET" >/dev/null 2>&1; docker logout "$REGISTRY" >/dev/null 2>&1' EXIT
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "${{ github.repository_owner }}" --password-stdin
          docker network create "$NET"
          docker run -d --name "$NET-api" --network "$NET" "$IMAGE"
          # -I: warnings are reported but don't fail the job; FAIL-level alerts do.
          docker run --rm --network "$NET" -e TARGET="http://$NET-api:8080" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            sh -c 'for i in $(seq 30); do curl -sf "$TARGET/healthz" >/dev/null && exec zap-baseline.py -t "$TARGET" -I; sleep 2; done; echo "API did not become healthy"; exit 1'

  release:
    name: Release (update ArgoCD manifest)
    runs-on: ubuntu-latest
    needs: [build-test, dast]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: develop

      - name: Bump image tag
        run: |
          git config user.name "gitea-actions"
          git config user.email "gitea-actions@${REGISTRY}"
          sed -i "s|^\(\s*newTag:\).*|\1 \"${{ github.sha }}\"|" deploy/k8s/kustomization.yaml
          git add deploy/k8s/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci(deploy): release ${{ github.sha }} [skip ci]"
          git push origin HEAD:develop
